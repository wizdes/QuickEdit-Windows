<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickEdit UI Automation bridge</title>
<style>
  :root { --bg: #f5f7fb; --ink: #172334; --soft: #42546c; --card: #ffffff; --line: #d7dfeb; --box: #edf3ff; --boxline: #506ca3; --host: #e7f8ef; --hostline: #418263; --arrow: #50647f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161f; --ink: #e8eef7; --soft: #a9b7ca; --card: #182130; --line: #2c3a4f; --box: #1e2c45; --boxline: #7f9bd1; --host: #17352a; --hostline: #63b28d; --arrow: #a9b7ca; }
  }
  body { font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); margin: 0; padding: 2rem 16px; }
  main { max-width: 920px; margin: auto; }
  h1 { font-size: 1.7rem; margin-bottom: .25rem; }
  p { max-width: 70ch; }
  svg { display: block; max-width: 100%; height: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .box { fill: var(--box); stroke: var(--boxline); stroke-width: 2; }
  .host { fill: var(--host); stroke: var(--hostline); stroke-width: 2; }
  .text { font: 600 17px system-ui, sans-serif; fill: var(--ink); text-anchor: middle; }
  .small { font: 14px system-ui, sans-serif; fill: var(--soft); text-anchor: middle; }
  .arrow { stroke: var(--arrow); stroke-width: 2.5; fill: none; marker-end: url(#head); }
  #head path { fill: var(--arrow); }
</style>
<main>
<h1>QuickEdit UI Automation bridge</h1>
<p>A screen reader sends WM_GETOBJECT, and the window answers with the one root object. UIA then calls the objects on its own worker thread. Each host call crosses to the window's thread as a sent message, so the editor is only touched on its own thread.</p>
<svg viewBox="0 0 920 520" role="img" aria-label="A client calls the root, widgets, document and ranges on a UIA thread. Their host calls cross to the window thread, where the host reaches the editor view.">
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="box" x="330" y="20" width="260" height="66" rx="12"/><text class="text" x="460" y="48">Screen reader</text><text class="small" x="460" y="70">IUIAutomation, other process</text>
  <rect class="box" x="330" y="124" width="260" height="66" rx="12"/><text class="text" x="460" y="152">Root</text><text class="small" x="460" y="174">joined to the window's own element</text>
  <rect class="box" x="40" y="228" width="260" height="66" rx="12"/><text class="text" x="170" y="256">Widget nodes</text><text class="small" x="170" y="278">found by WidgetId on each call</text>
  <rect class="box" x="620" y="228" width="260" height="66" rx="12"/><text class="text" x="750" y="256">The one document object</text><text class="small" x="750" y="278">Text, Text2, Value when read-only</text>
  <rect class="box" x="330" y="228" width="260" height="66" rx="12"/><text class="text" x="460" y="256">Text ranges</text><text class="small" x="460" y="278">UTF-16 ends, view, document, revision</text>
  <rect class="box" x="330" y="332" width="260" height="66" rx="12"/><text class="text" x="460" y="360">marshal.rs</text><text class="small" x="460" y="382">sent message, 2 s wait, then "ask again"</text>
  <rect class="host" x="330" y="436" width="260" height="66" rx="12"/><text class="text" x="460" y="464">UiaHost, then EditorView</text><text class="small" x="460" y="486">on the window's thread</text>
  <path class="arrow" d="M460 86V122"/>
  <path class="arrow" d="M400 190L200 226"/>
  <path class="arrow" d="M520 190L720 226"/>
  <path class="arrow" d="M620 261H592"/>
  <path class="arrow" d="M170 294V365H328"/>
  <path class="arrow" d="M460 294V330"/>
  <path class="arrow" d="M460 398V434"/>
</svg>
</main>
</html>
