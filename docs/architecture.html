<body><div class="frame">
<p class="eyebrow">Architecture · QuickEdit for Windows</p>
<h1>The window's thread starts jobs. Workers do the slow work.</h1>
<p class="lede">Each box is a crate. Arrows are calls or data. Every worker ends by posting a wake, and a second launch hands its files through a named pipe.</p>
