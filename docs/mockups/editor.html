<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickEdit — editor directions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d8dde4;color:#202833;font:13px/1.4 "Segoe UI",Arial,sans-serif}header,main{max-width:1400px;margin:auto;padding:28px 30px}header{padding-bottom:7px}h1{font-size:25px;margin:0 0 4px}header p{margin:0;color:#52606d}.direction{margin-bottom:43px}.direction h2{font-size:18px;margin:0 0 3px}.direction>p{margin:0 0 12px;color:#52606d}.sample{margin-bottom:15px}.sample h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#52606d;margin:0 0 7px}.window{--paper:#fff;--ink:#202020;--row:#f5f5f5;--border:#d2d6da;--dim:#858585;--map:#6e7c86;--highlight:#e7edf5;width:max-content;max-width:100%;background:var(--paper);color:var(--ink);border:1px solid #aab2bc;border-radius:7px;box-shadow:0 14px 30px #19243426;overflow-x:auto}.dark .window{--paper:#1e1e1e;--ink:#eaeaea;--row:#292929;--border:#454545;--dim:#9c9c9c;--map:#8b9ba7;--highlight:#3a485a;border-color:#5b6168}.top{height:38px;background:var(--row);border-bottom:1px solid var(--border);display:flex;align-items:end;padding-left:11px}.tab{background:var(--paper);padding:8px 13px 7px;border:1px solid var(--border);border-bottom:0;border-radius:5px 5px 0 0;min-width:180px;display:flex;justify-content:space-between}.add,.caret{align-self:center;padding:0 10px;font-size:18px}.caret{font-size:13px}.wincontrols{display:flex;margin-left:auto;align-self:stretch}.wincontrols span{width:43px;display:grid;place-items:center}.findbar{border-bottom:1px solid var(--border);background:var(--row);padding:9px 12px;display:flex;align-items:center;gap:8px;min-height:76px;font-size:12px}.findmain{display:flex;align-items:center;gap:7px}.findfields{display:grid;gap:5px}.field{border:1px solid var(--border);background:var(--paper);min-width:250px;padding:5px 8px;border-radius:4px}.field.replace{color:var(--dim)}.btn{border:1px solid var(--border);background:var(--paper);padding:5px 8px;border-radius:4px;white-space:nowrap}.counter{color:var(--dim);white-space:nowrap}.findright{display:flex;gap:5px;align-items:center}.view{display:flex;align-items:stretch;min-height:493px}.gutter{width:43px;flex:none;background:var(--paper);border-right:1px solid var(--border);padding:20px 8px 0 0;text-align:right;color:var(--dim);font:11px/20px "Cascadia Mono",Consolas,monospace;white-space:pre}.text{width:90ch;flex:none;padding:20px 0 0 10px;font:13px/20px "Cascadia Mono",Consolas,monospace;white-space:pre;overflow:hidden}.match{background:#f8df72;color:#252525}.dark .match{background:#805d22;color:white}.map{width:100px;flex:none;position:relative;padding:16px 7px;background:var(--paper);overflow:hidden}.map-lines{font:2px/2px "Cascadia Mono",Consolas,monospace;color:var(--map);opacity:.45;white-space:pre;letter-spacing:-.5px;transform:scaleX(.75);transform-origin:left top}.hoverbox{position:absolute;top:18px;left:0;right:0;height:62px;background:#7d88951a;border:1px solid #7d889538}.dark .hoverbox{background:#dde5ef1a;border-color:#dde5ef38}.map .pointer{position:absolute;right:1px;top:41px;font-size:12px;color:var(--dim)}.status{height:24px;border-top:1px solid var(--border);background:var(--row);padding:4px 12px;color:var(--dim);font-size:11px}.b .top{height:45px;background:#e8edf4}.b.dark .top{background:#202630}.b .tab{border-radius:8px 8px 0 0;background:#f9fbfe}.b.dark .tab{background:#34404d}.b .findbar{min-height:88px;background:var(--paper);padding-left:18px}.b .field{border-radius:7px}.b .view .gutter{background:var(--row)}.b .map{background:var(--row)}.c .top{height:31px;background:var(--paper)}.c .tab{border:0;border-right:1px solid var(--border);border-radius:0;padding:6px 10px;min-width:160px}.c .findbar{background:var(--paper);min-height:65px;padding:6px 9px}.c .field,.c .btn{border-radius:0}.c .view{min-height:480px}.c .text{padding-top:15px}.c .gutter{padding-top:15px}.c .map{padding-top:11px}.c .hoverbox{top:13px}@media(max-width:760px){main,header{padding-left:10px;padding-right:10px}}
</style>
<header><h1>Editor with Find, line numbers, and map</h1><p>Three directions. The text area is 90 characters wide; the gutter and 100 px map sit outside it. The map box is shown as if the pointer is over the map.</p></header><main id="gallery"></main>
<script>
const note=['Groceries for Saturday','- oats, milk, two lemons','- coffee beans (the dark roast)','- bread from the corner bakery','','Ideas for the garden','Move the tomatoes to the sunny side. Plant basil next to them.','Fix the gate latch before the rain comes back.','','Call Sam about the trip on the 14th.'];
const dirs=[['A','Find controls form one compact row above a plain Mac-like text area.','a'],['B','A taller Terminal strip and a separate Find shelf give controls more space.','b'],['C','A short flat row and square controls keep the text area foremost.','c']];
const mapline='■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■\n■■■■■■■■■■■■■■■■■■■■■■■■■\n■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■\n■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■\n\n■■■■■■■■■■■■■■■■■■■■■■■■\n■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■\n■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■\n\n■■■■■■■■■■■■■■■■■■■■■■■■■■■■';
function sample(cls,theme){const lines=note.map((s,i)=>s.replace('tomatoes','<span class="match">tomatoes</span>')).join('\n');return `<div class="sample ${theme}"><h3>${theme}</h3><div class="window ${cls}"><div class="top"><div class="tab">Saturday notes.txt <span>×</span></div><span class="add">+</span><span class="caret">⌄</span><div class="wincontrols"><span>─</span><span>□</span><span>×</span></div></div><div class="findbar"><div class="findmain"><span class="btn">⌄</span><div class="findfields"><span class="field">tomatoes</span><span class="field replace">peppers</span></div></div><span class="counter">1 of 1</span><div class="findright"><span class="btn">‹</span><span class="btn">›</span><span class="btn">Replace</span><span class="btn">Replace All</span><span class="btn">Done</span></div></div><div class="view"><div class="gutter">${note.map((_,i)=>i+1).join('\n')}</div><div class="text">${lines}</div><div class="map"><div class="map-lines">${mapline}</div><div class="hoverbox"></div><span class="pointer">◀</span></div></div></div></div>`}
document.getElementById('gallery').innerHTML=dirs.map(([letter,idea,cls])=>`<section class="direction"><h2>${letter}</h2><p>${idea}</p>${sample(cls,'light')}${sample(cls,'dark')}</section>`).join('');
</script></html>
