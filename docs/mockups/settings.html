<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickEdit — Settings directions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d8dde4;color:#1c2530;font:13px/1.35 "Segoe UI",Arial,sans-serif}header,main{max-width:1500px;margin:auto;padding:25px 35px}header{padding-bottom:8px}h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#536170}.direction{margin:0 0 42px}.direction h2{font-size:18px;margin:0 0 3px}.direction>p{margin:0 0 10px;color:#536170}.theme-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#536170;margin:15px 0 7px}.panes{display:grid;grid-template-columns:440px 440px 394px;gap:16px;overflow-x:auto;padding-bottom:17px}.window{--paper:white;--ink:#222;--sub:#646b72;--rule:#d6d8dc;--soft:#f5f6f8;--field:#fff;--accent:#2862ad;width:440px;min-height:494px;background:var(--paper);color:var(--ink);border:1px solid #a8b1ba;border-radius:8px;box-shadow:0 10px 20px #25344818;overflow:hidden}.window.keyboard{width:394px}.dark .window{--paper:#1e1e1e;--ink:#ececec;--sub:#acb2b8;--rule:#444;--soft:#292929;--field:#292929;--accent:#8fbaff;border-color:#5a626b}.chrome{height:43px;background:var(--soft);border-bottom:1px solid var(--rule);padding:11px 14px;font-weight:600}.body{padding:13px 20px 16px}.section{margin-bottom:15px}.section-title{font-size:12px;font-weight:650;color:var(--ink);margin-bottom:6px}.hint{font-size:11px;color:var(--sub);margin:0 0 7px}.check{display:flex;align-items:flex-start;gap:7px;margin:6px 0;line-height:1.35}.box{width:13px;height:13px;border:1px solid #8693a0;border-radius:3px;display:inline-grid;place-items:center;flex:none;margin-top:1px;background:var(--field);font-size:11px}.box.on{background:var(--accent);border-color:var(--accent);color:#fff}.line{display:flex;align-items:center;gap:6px;margin:6px 0}.input,.select,.button{background:var(--field);border:1px solid var(--rule);border-radius:4px;padding:4px 7px;color:var(--ink)}.input{min-width:34px;text-align:center}.button{display:inline-block;background:var(--soft);padding:4px 10px}.select{min-width:245px;display:flex;justify-content:space-between}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cols .check{font-size:11.5px}.footer{padding:11px 18px;border-top:1px solid var(--rule);margin-top:auto;font-size:11px;display:flex;justify-content:space-between}.tabnav{display:flex;gap:5px;padding:7px 12px 0;background:var(--soft);border-bottom:1px solid var(--rule)}.tabnav span{padding:5px 8px;color:var(--sub)}.tabnav .active{background:var(--paper);border:1px solid var(--rule);border-bottom:0;border-radius:5px 5px 0 0;color:var(--ink);font-weight:600}.keyboard .body{padding:9px 12px}.keyboard .hint{margin:2px 0 8px}.table{border:1px solid var(--rule);height:337px;overflow:hidden;font-size:10.5px}.tr{display:grid;grid-template-columns:1fr 124px;min-height:18px;border-bottom:1px solid var(--rule)}.tr span{padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tr span+span{border-left:1px solid var(--rule)}.tr.head{font-weight:600;background:var(--soft)}.tr.group{font-weight:700;background:var(--soft)}.tr.child span:first-child{padding-left:16px}.table-scroll{height:317px;overflow-y:auto}.keyboard-foot{display:flex;justify-content:flex-end;margin-top:9px}.window.b{display:grid;grid-template-columns:115px 1fr;grid-template-rows:43px 1fr}.b .chrome{grid-column:1/3}.b .tabnav{grid-column:1;grid-row:2;display:block;padding:12px 5px;border-right:1px solid var(--rule);border-bottom:0}.b .tabnav span{display:block;padding:8px 6px}.b .tabnav .active{border:0;border-radius:4px;background:var(--accent);color:white}.b .body{grid-column:2;grid-row:2;padding:12px}.b .footer{grid-column:1/3;grid-row:3}.b .cols{grid-template-columns:1fr}.b .check{font-size:11px}.b .select{min-width:0;width:100%}.b .tr{grid-template-columns:1fr 86px}.window.c{border-radius:0}.c .chrome{font-size:16px;background:var(--paper);border-bottom:0;padding-bottom:0}.c .tabnav{background:var(--paper);border-bottom:1px solid var(--rule)}.c .tabnav .active{border:0;border-bottom:2px solid var(--accent);border-radius:0}.c .body{padding:16px 22px}.c .section{border-bottom:1px solid var(--rule);padding-bottom:11px}.c .section:last-child{border-bottom:0}.window.d{border-radius:12px}.d .chrome{background:var(--paper);height:50px;padding:16px 20px}.d .tabnav{background:var(--paper);padding:0 12px 8px}.d .tabnav span{border-radius:8px;padding:7px 9px}.d .tabnav .active{background:var(--soft);border:1px solid var(--rule)}.d .section{background:var(--soft);border-radius:8px;padding:10px 12px}.d .select,.d .input{background:var(--paper)}.d .button{background:var(--paper)}@media(max-width:700px){main,header{padding-left:12px;padding-right:12px}}
.panes{align-items:start}.a.keyboard{height:464px;min-height:464px}.a.keyboard .table{height:290px}.a.keyboard .table-scroll{height:270px}.c-scroll{width:440px;min-height:0}.c-scroll .body h3{font-size:15px;margin:22px 0 12px;border-top:1px solid var(--rule);padding-top:17px}.c-scroll .body h3:first-child{margin-top:0;border:0;padding-top:0}.c-scroll .table{height:auto}.c-scroll .table-scroll{height:auto;max-height:none}.c-scroll .section{margin-bottom:12px}.tr span+span{font-family:"Cascadia Mono",Consolas,monospace}
</style>
<header><h1>Settings</h1><p>Four layouts. Each direction shows New Document, Open and Save, and Keyboard in full, in light and dark.</p></header><main id="gallery"></main>
<script>
const dirs=[['A','Mac layout: 440 wide, top tabs, compact groups and native-style controls.','a'],['B','Windows side navigation, with controls in a narrow reading column.','b'],['C','One scrolling settings page with plain dividers and denser type.','c'],['D','Top tabs and separate cards with more space around each group.','d']];
const checks=(arr)=>arr.map(([label,on])=>`<div class="check"><span class="box ${on?'on':''}">${on===null?'—':on?'✓':''}</span><span>${label}</span></div>`).join('');
const nav=(active)=>`<div class="tabnav">${['New Document','Open and Save','Keyboard'].map(x=>`<span class="${x===active?'active':''}">${x}</span>`).join('')}</div>`;
const newDoc=`<div class="section"><div class="section-title">Format</div><p class="hint">Use the Format menu to choose settings for an open document.</p>${checks([['Wrap to page',false]])}</div><div class="section"><div class="section-title">Window Size</div><div class="line">Width: <span class="input">90</span> characters</div><div class="line">Height: <span class="input">30</span> lines</div></div><div class="section"><div class="section-title">Font</div><div class="line">Plain text font: <span class="button">Change...</span> <span style="font-size:11px">Cascadia Mono, 10 pt</span></div></div><div class="section"><div class="section-title">Options</div><div class="cols"><div>${checks([['Check spelling as you type',false],['Check grammar',false],['Correct spelling automatically',false],['Show Writing Tools and predictive text',false]])}</div><div>${checks([['Smart copy/paste',true],['Smart quotes',false],['Smart dashes',false],['Text replacement',null]])}</div></div><p class="hint">Text replacement follows the system setting.</p></div><div class="section"><div class="section-title">View</div>${checks([['Show line numbers',false]])}</div>`;
const openSave=`<div class="section"><div class="section-title">When Saving a File:</div>${checks([['Add ".txt" extension to plain text files',true]])}</div><div class="section"><div class="section-title">Plain Text File Encoding</div><div class="line">Opening files: <span class="select">Automatic <b>⌄</b></span></div><div class="line">Saving files: <span class="select">Automatic <b>⌄</b></span></div><p class="hint">Both lists: Automatic; UTF-8; UTF-16; Mac Roman; Western (Windows 1252); Japanese (Mac); Japanese (Shift JIS); Chinese Traditional (Mac); Korean (Mac); Chinese Simplified (Mac); GB 18030; Customize Encodings List…</p></div>`;
const rows=[['File',''],['New','Ctrl+N'],['New Tab','Ctrl+T'],['Open…','Ctrl+O'],['Open Recent',''],['Close Tab','Ctrl+W'],['Save','Ctrl+S'],['Duplicate','Ctrl+Shift+S'],['Save As…','Ctrl+Alt+Shift+S'],['Rename…',''],['Move To…',''],['Save All',''],['Revert to Saved',''],['Export as PDF…',''],['Print…','Ctrl+P'],['Edit',''],['Undo','Ctrl+Z'],['Redo','Ctrl+Shift+Z'],['Cut','Ctrl+X'],['Copy','Ctrl+C'],['Paste','Ctrl+V'],['Delete','Delete'],['Complete','Ctrl+Space'],['Select All','Ctrl+A'],['Find ›',''],['Find…','Ctrl+F'],['Find and Replace…','Ctrl+H'],['Find Next','F3'],['Find Previous','Shift+F3'],['Use Selection for Find','Ctrl+E'],['Jump to Selection','Ctrl+J'],['Select Line…','Ctrl+L'],['Spelling and Grammar ›',''],['Show Spelling','Ctrl+:'],['Check Document Now','Ctrl+;'],['Transformations ›',''],['Make Upper Case',''],['Make Lower Case',''],['Capitalize',''],['Format',''],['Prevent Editing',''],['Wrap to Page','Ctrl+Shift+W'],['View',''],['Actual Size','Ctrl+.'],['Zoom In','Ctrl+='],['Zoom Out','Ctrl+-'],['Show Line Numbers',''],['Show Document Map',''],['Enter Full Screen','F11'],['Window',''],['Minimize','Ctrl+M'],['Zoom',''],['Show Previous Tab','Ctrl+Shift+Tab'],['Show Next Tab','Ctrl+Tab'],['Tab 1 to 9','Ctrl+1…9'],['Last Tab','Ctrl+0'],['Move Tab to New Window',''],['Merge All Windows',''],['Help','']];
const groups=new Set(['File','Edit','Format','View','Window','Help']);
const keyboard=`<p class="hint">Click a shortcut, then press the new keys. Esc cancels. Delete resets.</p><div class="table"><div class="tr head"><span>Command</span><span>Shortcut</span></div><div class="table-scroll">${rows.map(([name,key])=>`<div class="tr ${groups.has(name)?'group':name.endsWith('›')?'child':''}"><span>${name}</span><span>${key}</span></div>`).join('')}</div></div><div class="keyboard-foot"><span class="button">Restore Keyboard Defaults</span></div>`;
function panel(cls,theme,title,content){return `<div class="window ${cls} ${title==='Keyboard'?'keyboard':''}"><div class="chrome">Settings</div>${nav(title)}<div class="body">${content}</div><div class="footer"><span class="button">Restore All Defaults</span><span>${title}</span></div></div>`}
function scrollingPage(){return `<div class="window c c-scroll"><div class="chrome">Settings</div><div class="tabnav"><span class="active">New Document</span><span>Open and Save</span><span>Keyboard</span></div><div class="body"><h3>New Document</h3>${newDoc}<h3>Open and Save</h3>${openSave}<h3>Keyboard</h3>${keyboard}</div><div class="footer"><span class="button">Restore All Defaults</span><span>All settings</span></div></div>`}
document.getElementById('gallery').innerHTML=dirs.map(([letter,idea,cls])=>`<section class="direction"><h2>${letter}</h2><p>${idea}</p>${['light','dark'].map(theme=>`<div class="${theme}"><div class="theme-label">${theme}</div>${cls==='c'?scrollingPage():`<div class="panes">${panel(cls,theme,'New Document',newDoc)}${panel(cls,theme,'Open and Save',openSave)}${panel(cls,theme,'Keyboard',keyboard)}</div>`}</div>`).join('')}</section>`).join('');
</script></html>
