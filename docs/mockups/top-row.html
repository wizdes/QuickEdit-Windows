<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickEdit — top row directions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d8dde4;color:#18212b;font:14px/1.4 "Segoe UI",Arial,sans-serif}header{padding:30px 38px 20px;max-width:1500px;margin:auto}h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#475569}main{max-width:1500px;margin:auto;padding:0 38px 55px}.direction{margin:0 0 42px}.direction h2{font-size:18px;margin:0 0 3px}.direction>p{margin:0 0 15px;color:#475569}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.sample>h3{font-size:12px;text-transform:uppercase;letter-spacing:.13em;margin:0 0 7px;color:#475569}.frame{--paper:#fff;--ink:#222;--row:#f5f5f5;--border:#d6d6d6;--tab:#fff;--muted:#66717d;--hover:#e7ecf1;position:relative;background:var(--paper);color:var(--ink);border:1px solid #aab2bc;border-radius:7px;box-shadow:0 14px 28px #1d27341f;overflow:hidden;min-height:505px}.dark .frame{--paper:#1e1e1e;--ink:#e8e8e8;--row:#262626;--border:#414141;--tab:#333;--muted:#a5a5a5;--hover:#414141;border-color:#575b61}.titlebar{height:var(--height);background:var(--row);display:flex;align-items:stretch;border-bottom:1px solid var(--border)}.tabs{display:flex;align-items:end;gap:var(--gap);padding:0 0 0 10px;min-width:0;flex:1}.tab{height:var(--tabheight);width:var(--tabwidth);display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--tab);border:1px solid var(--border);border-bottom:0;overflow:hidden;white-space:nowrap}.tab .fileicon{font-size:12px;color:var(--muted)}.tab .name{overflow:hidden;text-overflow:ellipsis;flex:1}.tab .close{color:var(--muted);font-size:15px}.tab .dot{width:7px;height:7px;background:var(--muted);border-radius:50%;flex:none}.tab.inactive{background:transparent;border-color:transparent;color:var(--muted)}.add,.caret,.winbtn{border:0;background:transparent;color:var(--ink);font:inherit;display:grid;place-items:center;cursor:default}.add,.caret{height:var(--height);width:35px;font-size:19px}.caret{font-size:13px}.winbtn{height:var(--height);width:42px}.winbtn.closewin:hover{background:#c42b1c;color:white}.winbtn:hover,.add:hover,.caret:hover{background:var(--hover)}.controls{display:flex;align-items:stretch}.line{height:1px;background:var(--border)}.editor{padding:23px 29px;min-height:426px;font:13px/1.65 "Cascadia Mono",Consolas,monospace;white-space:pre-wrap}.menus{position:absolute;z-index:2;top:calc(var(--height) - 1px);left:145px;display:flex;align-items:flex-start;filter:drop-shadow(0 10px 15px #0004)}.menu,.submenu{background:var(--paper);border:1px solid var(--border);padding:6px;min-width:175px;font:12px/1.3 "Segoe UI",Arial,sans-serif}.submenu{min-width:235px;margin-left:-1px}.item{display:flex;justify-content:space-between;gap:20px;padding:5px 9px;white-space:nowrap}.item.selected{background:#dce9f9}.dark .item.selected{background:#355477}.item .key{color:var(--muted)}.separator{border-top:1px solid var(--border);margin:5px 8px}.states{display:flex;gap:10px;padding:9px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}.states span{display:inline-flex;align-items:center;gap:5px}.mini-tab{border:1px solid var(--border);background:var(--row);padding:3px 7px}.mini-tab.dirty:after{content:'●';font-size:9px;margin-left:7px}.a{--height:37px;--tabheight:34px;--tabwidth:172px;--gap:3px}.a .tab{border-radius:5px 5px 0 0}.a .menus{left:185px}.b{--height:44px;--tabheight:35px;--tabwidth:185px;--gap:5px}.b .titlebar{background:#e9edf2}.dark .b .titlebar{background:#20252c}.b .tab{background:#f7f9fc;border-radius:8px 8px 0 0}.dark .b .tab{background:#343d49}.b .menus{left:202px}.c{--height:31px;--tabheight:30px;--tabwidth:160px;--gap:0px}.c .titlebar{background:var(--paper)}.c .tab{border:0;border-right:1px solid var(--border);border-radius:0;padding-left:9px}.c .tab.inactive{border-right:1px solid var(--border)}.c .menus{left:169px}.c .editor{padding-top:15px}.d{--height:49px;--tabheight:39px;--tabwidth:200px;--gap:4px}.d .titlebar{background:#dfe4eb}.dark .d .titlebar{background:#1b222b}.d .tab{border-radius:7px 7px 0 0;background:#fff}.dark .d .tab{background:#303a47}.d .menus{left:214px}.d .editor{padding-top:28px}@media(max-width:1100px){.pair{grid-template-columns:1fr}.frame{min-height:490px}}@media(max-width:680px){main{padding:0 12px 30px}header{padding:20px 12px}.tab{width:145px!important}.controls .winbtn{width:30px}.menus{left:90px!important}.submenu{min-width:190px}.menu{min-width:125px}}
.sample{--row:#f5f5f5;--border:#d6d6d6;--tab:#fff}.sample.dark{--row:#262626;--border:#414141;--tab:#333}.states{display:grid;grid-template-columns:1fr 1fr;gap:9px}.statecase{min-width:0}.statecase>span{display:block;margin-bottom:4px}.statebar{display:flex;background:var(--row);border:1px solid var(--border);height:25px;align-items:stretch;overflow:hidden}.statebar .mini-tab{border-top:0;border-bottom:0;border-left:0;background:var(--tab);padding:4px 7px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.statebar .mini-tab.dirty:after{content:'●';font-size:8px;margin-left:4px}.statebar .mini-tab.inactive{background:transparent}.statebar b{font-weight:400;padding:3px 5px}.statebar .right{margin-left:auto;white-space:nowrap}
.dark .statebar{color:#e8e8e8}.dark .statecase>span{color:#c8ccd2}

.add,.caret{font-family:"Segoe Fluent Icons","Segoe MDL2 Assets";font-size:12px;height:24px;margin:auto 0;width:31px;line-height:24px;padding:0}
.add{border-radius:4px 0 0 4px;margin-left:4px}
.caret{border-radius:0 4px 4px 0;border-left:1px solid color-mix(in srgb,var(--ink) 18%,transparent);width:31px}
.winbtn{font-family:"Segoe Fluent Icons","Segoe MDL2 Assets";font-size:10px;width:46px}
.b{--height:40px;--tabheight:32px;--tabwidth:185px;--gap:8px}
.b .titlebar{background:#f0f0f0}
.dark .b .titlebar{background:#262626}
.b .tab{background:#fff;border-radius:8px 8px 0 0}
.dark .b .tab{background:#1e1e1e}
.b .titlebar{border-bottom:0}
.statebar b{font-family:"Segoe Fluent Icons","Segoe MDL2 Assets";font-weight:400;font-size:10px}
</style>
<header><h1>Top row and menus</h1><p>Four directions. Each uses one visible tab, a new tab button, the menu caret, and Windows window controls. The open caret shows File.</p></header>
<main id="gallery"></main>
<script>
const note='Groceries for Saturday\n- oats, milk, two lemons\n- coffee beans (the dark roast)\n- bread from the corner bakery\n\nIdeas for the garden\nMove the tomatoes to the sunny side. Plant basil next to them.\nFix the gate latch before the rain comes back.\n\nCall Sam about the trip on the 14th.';
const file=[['New','Ctrl+N'],['New Tab','Ctrl+T'],['Open…','Ctrl+O'],['Open Recent','›'],['—',''],['Close Tab','Ctrl+W'],['Save','Ctrl+S'],['Duplicate','Ctrl+Shift+S'],['Save As…','F12'],['Rename…',''],['Move To…',''],['Save All',''],['Revert to Saved',''],['—',''],['Export as PDF…',''],['Print…','Ctrl+P']];
const dirs=[['A','Low row with a flat tab; the text starts close below it.','a'],['B','Round tab with a taller Terminal-style strip and clearer active state.','b'],['C','One quiet surface; thin tab dividers keep the row close to the Mac window.','c'],['D','Tall strip and a filled tab; controls have more space for touch.','d']];
function menu(){return `<div class="menus"><div class="menu">${['File','Edit','Format','View','Window','Help','—','Settings','About'].map((x,i)=>x==='—'?'<div class="separator"></div>':`<div class="item ${i===0?'selected':''}"><span>${x}</span><span class="key">${i<6?'›':''}</span></div>`).join('')}</div><div class="submenu">${file.map(([name,key])=>name==='—'?'<div class="separator"></div>':`<div class="item"><span>${name}</span><span class="key">${key}</span></div>`).join('')}</div></div>`}
function sample(cls,theme){return `<div class="sample ${theme}"><h3>${theme}</h3><div class="frame ${cls}"><div class="titlebar"><div class="tabs"><div class="tab"><span class="fileicon">▤</span><span class="name">Saturday notes.txt</span><span class="close">×</span></div><button class="add" aria-label="New tab">&#xE710;</button><button class="caret" aria-label="All menus">&#xE96E;</button></div><div class="controls"><button class="winbtn" aria-label="Minimize">&#xE921;</button><button class="winbtn" aria-label="Maximize">&#xE922;</button><button class="winbtn closewin" aria-label="Close">&#xE8BB;</button></div></div><div class="editor">${note}</div>${menu()}</div><div class="states"><div class="statecase"><span>Three tabs</span><div class="statebar"><i class="mini-tab">Notes</i><i class="mini-tab inactive">Ideas</i><i class="mini-tab inactive">Trip</i><b>&#xE710;</b><b>&#xE96E;</b><b class="right">─　□　×</b></div></div><div class="statecase"><span>One tab with unsaved edits</span><div class="statebar"><i class="mini-tab dirty">Notes</i><b>&#xE710;</b><b>&#xE96E;</b><b class="right">─　□　×</b></div></div></div></div>`}
document.getElementById('gallery').innerHTML=dirs.map(([letter,idea,cls])=>`<section class="direction"><h2>${letter}</h2><p>${idea}</p><div class="pair">${sample(cls,'light')}${sample(cls,'dark')}</div></section>`).join('');
</script></html>
